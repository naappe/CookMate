<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CookMate — Professional Flavour Cookbook</title>
<style>:root{--ink:#17201c;--muted:#68716c;--paper:#f4f1ea;--card:#fff;--green:#153f33;--gold:#b87827;--line:#ded9cf;--soft:#f8f6f1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--green);color:#fff;padding:28px 20px}.wrap{max-width:1180px;margin:auto}.brand{font-size:27px;font-weight:800}.tag{opacity:.75;margin-top:4px}.toolbar{display:flex;gap:8px;margin:20px 0}.search{flex:1;border:1px solid var(--line);border-radius:9px;padding:13px 14px;font:inherit;background:#fff}.filter{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 13px;font-weight:650;cursor:pointer}.layout{display:grid;grid-template-columns:310px 1fr;gap:16px;padding-bottom:45px}.library,.recipe{background:var(--card);border:1px solid var(--line);border-radius:14px}.library{padding:10px;height:max-content}.libtitle{padding:9px 8px 12px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.recipeItem{display:block;width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:9px;cursor:pointer;border-bottom:1px solid #eee}.recipeItem:hover,.recipeItem.active{background:#eef3f0}.recipeItem b{display:block}.recipeItem span{font-size:12px;color:var(--muted)}.recipe{padding:25px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--gold);font-weight:800}.title{font-family:Georgia,serif;font-size:36px;line-height:1.05;margin:7px 0 8px}.desc{color:var(--muted);max-width:760px;line-height:1.55}.meta{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0}.meta div{background:var(--soft);border-radius:9px;padding:10px}.meta b{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.section{border-top:1px solid var(--line);padding-top:20px;margin-top:20px}.section h2{font-size:17px;margin:0 0 12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid #eee;padding:9px 6px;font-size:13px}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.layer{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #eee}.layer b{font-size:12px;color:var(--green)}.layer span{font-size:13px;color:var(--muted)}.step{display:grid;grid-template-columns:36px 1fr;gap:11px;padding:12px 0;border-bottom:1px solid #eee}.n{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:800;font-size:13px}.step b{display:block}.step p{margin:3px 0;color:var(--muted);font-size:13px;line-height:1.5}.qc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.qc div{background:var(--soft);border-radius:9px;padding:11px}.qc b{display:block;font-size:12px}.qc span{font-size:12px;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr}.meta{grid-template-columns:repeat(2,1fr)}.two,.qc{grid-template-columns:1fr}.title{font-size:29px}.library{max-height:260px;overflow:auto}}</style></head>
<body><header><div class="wrap"><div class="brand">CookMate</div><div class="tag">Professional flavour cookbook and kitchen reference</div></div></header><main class="wrap"><div class="toolbar"><input id="search" class="search" placeholder="Search recipes, ingredients or flavour systems"><button class="filter">All Recipes</button></div><div class="layout"><aside class="library"><div class="libtitle">Recipe Library</div><div id="list"></div></aside><article class="recipe" id="recipe"></article></div></main>
<script>
const recipes=[{
name:"Singapore-Style Black Pepper Prawns",cat:"Seafood · Asian",desc:"Prawns coated in a glossy, pepper-forward savoury sauce built from aromatics, umami sauces, controlled sweetness and butter.",
yield:"2–3 portions",prep:"15 min",cook:"8–10 min",heat:"High → Medium",main:"400 g prawns",
ingredients:[["Large prawns, cleaned","400 g"],["Whole black peppercorns","10 g / 1 heaped tbsp"],["Cooking oil","2 tbsp total"],["Salt","½ tsp, adjust"],["Butter","1 tbsp"],["Garlic, finely chopped","20 g"],["Ginger, finely chopped","5 g"],["Shallots, finely chopped","40 g"],["Dry red chillies","2–3"],["Curry leaves","1 sprig"],["Dark soy sauce","1 tbsp"],["Oyster sauce","1 tbsp"],["Tomato ketchup","1 tbsp"],["Worcestershire sauce","1 tsp"],["Cornflour","1 tsp"],["Water for slurry","2 tbsp"]],
layers:[["Primary character","Coarsely crushed black pepper provides fragrant heat and defines the dish."],["Aromatic foundation","Garlic, ginger and shallots create the savoury aromatic base."],["Secondary aroma","Dry chilli and curry leaves add heat and a distinctive fragrant top note."],["Savoury anchor","Oyster sauce supplies body and umami; dark soy deepens colour and seasoning."],["Balance","Ketchup contributes restrained sweetness and tang; Worcestershire adds fermented savoury acidity."],["Richness","Butter rounds the pepper heat and gives the finished sauce gloss."],["Texture","Cornflour slurry converts the liquid seasonings into a coating sauce."]],
steps:[["Mise en place","Clean and dry the prawns. Finely chop garlic, ginger and shallots. Cut chillies. Wash and dry curry leaves. Coarsely crush the peppercorns. Mix the cornflour slurry separately."],["Season prawns","Season the prawns lightly with salt. Keep all sauce ingredients measured and within reach before heating the pan."],["Sear","Heat oil in a wide pan over high heat. Cook prawns quickly in a single layer until the exterior changes colour and begins to sear. Remove before prolonged cooking."],["Build aromatics","Reduce to medium heat. Add oil and butter, followed by shallots, garlic and ginger. Cook until fragrant without burning the garlic. Add chilli and curry leaves."],["Build sauce","Add crushed black pepper, dark soy, oyster sauce, ketchup and Worcestershire. Stir briefly so the components combine."],["Glaze","Return prawns to the pan. Toss through the sauce. Stir the slurry, add gradually, and toss only until the sauce becomes glossy and coats the prawns."],["Finish","Remove from heat promptly. Check pepper, salt and sauce consistency before serving."]],
quality:[["Pepper","Clearly dominant and aromatic, not bitter."],["Prawns","Juicy and just cooked, not rubbery."],["Sauce","Glossy coating; neither watery nor pasty."],["Balance","Savoury first, with controlled sweetness and acidity."],["Aromatics","Garlic and ginger fragrant, never burnt."],["Service","Serve immediately; suitable with fried rice or noodles."]],
adjust:[["More black pepper","Stronger fragrant heat and sharper pepper character."],["More oyster sauce","Deeper savoury flavour, but also more salt."],["More ketchup","Sweeter and tangier; softens aggressive pepper."],["More butter","Richer, smoother and glossier."],["More Worcestershire","More tang and fermented savoury depth."],["More slurry","Thicker coating; excess makes the sauce pasty."]]
}];
function card(r){return '<div class="eyebrow">'+r.cat+'</div><h1 class="title">'+r.name+'</h1><p class="desc">'+r.desc+'</p><div class="meta"><div><b>Yield</b>'+r.yield+'</div><div><b>Prep</b>'+r.prep+'</div><div><b>Cook</b>'+r.cook+'</div><div><b>Heat</b>'+r.heat+'</div><div><b>Main</b>'+r.main+'</div></div><div class="section two"><div><h2>Ingredients</h2><table class="table"><thead><tr><th>Ingredient</th><th>Quantity</th></tr></thead><tbody>'+r.ingredients.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>').join("")+'</tbody></table></div><div><h2>Flavour architecture</h2>'+r.layers.map(x=>'<div class="layer"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join("")+'</div></div><div class="section"><h2>Professional cooking sequence</h2>'+r.steps.map((x,i)=>'<div class="step"><div class="n">'+(i+1)+'</div><div><b>'+x[0]+'</b><p>'+x[1]+'</p></div></div>').join("")+'</div><div class="section"><h2>Quality standard</h2><div class="qc">'+r.quality.map(x=>'<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join("")+'</div></div><div class="section"><h2>Flavour adjustment</h2><table class="table"><tbody>'+r.adjust.map(x=>'<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+'</td></tr>').join("")+'</tbody></table></div>'}
function render(q=""){let matches=recipes.filter(r=>(r.name+" "+r.cat+" "+r.ingredients.flat().join(" ")).toLowerCase().includes(q.toLowerCase()));document.getElementById("list").innerHTML=matches.map((r,i)=>'<button class="recipeItem '+(i===0?'active':'')+'" data-i="'+recipes.indexOf(r)+'"><b>'+r.name+'</b><span>'+r.cat+'</span></button>').join("");if(matches[0])document.getElementById("recipe").innerHTML=card(matches[0]);document.querySelectorAll(".recipeItem").forEach(b=>b.onclick=()=>{document.querySelectorAll(".recipeItem").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("recipe").innerHTML=card(recipes[+b.dataset.i])})}
document.getElementById("search").oninput=e=>render(e.target.value);render();
</script></body></html>
